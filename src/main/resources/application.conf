akka.javasdk {
  dev-mode {
    http-port = 9000
  }

  // Point the default agent model provider at OpenAI.
  // The api-key is picked up from the OPENAI_API_KEY environment variable
  // via akka.javasdk.agent.openai.api-key = ${?OPENAI_API_KEY}.
  agent {
    model-provider = "akka.javasdk.agent.openai"
    openai {
      model-name = "gpt-4o-mini"
      temperature = 0.2
    }
  }
}
